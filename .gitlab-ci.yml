image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay
  CONTAINER_RELEASE_IMAGE: registry.gitlab.com/bit-group1/classified/app
  CONTAINER_DEV_SQL: registry.gitlab.com/bit-group1/classified/sql
  WORKDIR: /builds/bit-group1/classified

stages:
  - fetch-version
  - build
  - release
fetch-semantic-version:
  # Requires Node >= 10.13 version
  image: node:18
  stage: fetch-version
  only:
    refs:
      - main
      - alpha
      - /^(([0-9]+)\.)?([0-9]+)\.x/ # This matches maintenance branches
      - /^([0-9]+)\.([0-9]+)\.([0-9]+)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+)?$/ # This matches pre-releases
  script:
    - npm install @semantic-release/gitlab @semantic-release/exec
    - npx semantic-release --generate-notes false --dry-run
  artifacts:
    paths:
      - VERSION.txt

generate-non-semantic-version:
  stage: fetch-version
  except:
    refs:
      - tags
      - main
      - alpha
      - /^(([0-9]+)\.)?([0-9]+)\.x/ # This matches maintenance branches
      - /^([0-9]+)\.([0-9]+)\.([0-9]+)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+)?$/ # This matches pre-releases
  script:
    - echo build-$CI_PIPELINE_ID > VERSION.txt
  artifacts:
    paths:
      - VERSION.txt


build:
  stage: build
  except:
    refs:
      - tags
  script:
    - mkdir logs
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker build -t $CONTAINER_RELEASE_IMAGE -f build/app/Dockerfile .
    - docker build -t $CONTAINER_DEV_SQL -f build/sql/Dockerfile .
    - docker network create classified_test
    - docker run -d --name classified-sql --network classified_test -e MYSQL_ROOT_PASSWORD="devpasswd" -p 3306:3306 $CONTAINER_DEV_SQL
    - docker run -d --name classified-app --network classified_test -p 80:80 $CONTAINER_RELEASE_IMAGE
    - echo "HERE WE WILL RUN VALIDATION TESTS"
    - docker logs classified-sql > logs/classified-sql.log
    - docker logs classified-app > logs/classified-app.log
    - docker stop classified-sql
    - docker stop classified-app
    - docker network rm classified_test
    - docker tag $CONTAINER_RELEASE_IMAGE $CONTAINER_RELEASE_IMAGE:$(cat VERSION.txt)
    - docker push $CONTAINER_RELEASE_IMAGE:$(cat VERSION.txt)
    - docker tag $CONTAINER_DEV_SQL $CONTAINER_DEV_SQL:$(cat VERSION.txt)
    - docker push $CONTAINER_DEV_SQL:$(cat VERSION.txt)

  tags:
    - docker
  artifacts:
    paths:
      - logs/
    expire_in: 1 week
    when: always

release:
  image: node:18
  stage: release
  only:
    refs:
      - main
      - alpha
      # This matches maintenance branches
      - /^(([0-9]+)\.)?([0-9]+)\.x/
      # This matches pre-releases
      - /^([0-9]+)\.([0-9]+)\.([0-9]+)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+)?$/
  script:
    - npm install @semantic-release/gitlab @semantic-release/exec
    - npx semantic-release


