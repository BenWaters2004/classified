version: '3.1'

services:
  service-classified:
    image: registry.gitlab.com/bit-group1/classified/app:build-1.0.0 # change version tag before deploying
    restart: "always"
    ports:
      - "4500:443"
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - service-db
    secrets:
       - settings
      
  service-db:
    image: registry.gitlab.com/bit-group1/classified/sql:1.0.3 # change version tag before deploying
    environment:
      - MYSQL_ROOT_PASSWORD=devpasswd
    expose:
      - "3306"

secrets:
  settings:
    file: ./../docker_specific/settings.json
