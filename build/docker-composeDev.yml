version: '3.1'

services:
  service-classified:
    build:
      context: ./../
      dockerfile: ./build/app/Dockerfile 
    working_dir: '/var/www/html'
    ports:
      - "4601:443"
    depends_on:
      - service-db
    secrets:
       - settings
      
  service-db:
    build:
      context: ./../
      dockerfile: ./build/sql/devDockerfile
    environment:
      - MYSQL_ROOT_PASSWORD=devpasswd
    expose:
      - "3306"

  service-mailhog:
    image: mailhog/mailhog
    expose:
      - "1025"
    ports:
      - "4600:8025"
    
secrets:
  settings:
    file: ./../docker_specific/settings.json
